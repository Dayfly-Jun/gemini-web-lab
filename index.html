<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Google Jules Cloud Sandbox</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f2; --ink: #172c25; --accent: #277656; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15211d; --ink: #eff5f0; --accent: #8cdfad; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; align-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    main { margin: auto; padding: 2rem; width: min(100%, 52rem); }
    p { color: var(--accent); font: 0.9rem ui-monospace, monospace; }
    h1 { margin: 1rem 0; font-size: clamp(1.8rem, 6vw, 3.75rem); line-height: 1.2; word-break: keep-all; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main><p>/gemini-web-lab/</p><h1>Google Jules Cloud Sandbox가 정상적으로 구축되었습니다</h1></main>
</body>
</html>
