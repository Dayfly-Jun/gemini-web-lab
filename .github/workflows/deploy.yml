name: Deploy Project Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Dayfly-Jun/gemini-web-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 게시할 정적 파일 준비
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Project Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
